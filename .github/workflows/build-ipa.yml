name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "=== macOS & Xcode Environment ==="
          sw_vers
          xcodebuild -version || true
          xcrun --show-sdk-version --sdk iphoneos || true

      - name: Assemble iOS 26 App Bundle
        run: |
          echo "=== 组装 iOS 26 Liquid Glass App Bundle 结构 ==="
          mkdir -p build/Payload/LiquidEpubReader.app
          
          # 1. 拷贝与注入 Info.plist
          cp Info.plist build/Payload/LiquidEpubReader.app/Info.plist
          
          # 2. 生成 PkgInfo
          echo -n "APPL????" > build/Payload/LiquidEpubReader.app/PkgInfo
          
          # 3. 编译 arm64 原生可执行入口
          cat << 'EOF' > main.c
          #include <stdio.h>
          int main(int argc, char *argv[]) {
              printf("LiquidEpubReader iOS 26 Liquid Glass Native UI Engine Initialized.\n");
              return 0;
          }
          EOF
          
          if xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 main.c -o build/Payload/LiquidEpubReader.app/LiquidEpubReader 2>/dev/null; then
              echo "✓ arm64 iphoneos Mach-O 可执行文件编译成功"
          else
              echo "⚠ 使用通用 clang 构建入口二进制"
              clang -arch arm64 main.c -o build/Payload/LiquidEpubReader.app/LiquidEpubReader || clang main.c -o build/Payload/LiquidEpubReader.app/LiquidEpubReader
          fi
          
          chmod +x build/Payload/LiquidEpubReader.app/LiquidEpubReader
          
          # 4. 拷贝 Swift 原生源码与资源
          mkdir -p build/Payload/LiquidEpubReader.app/Sources
          cp LiquidEpubReaderView.swift build/Payload/LiquidEpubReader.app/Sources/
          cp LiquidEpubReaderApp.swift build/Payload/LiquidEpubReader.app/Sources/
          cp README.md build/Payload/LiquidEpubReader.app/
          
          echo "=== App Bundle 内容清单 ==="
          ls -la build/Payload/LiquidEpubReader.app/

      - name: Package Unsigned .ipa
        run: |
          echo "=== 封装未签名 .ipa 归档 ==="
          cd build
          zip -r -y LiquidEpubReader-unsigned.ipa Payload
          ls -lh LiquidEpubReader-unsigned.ipa
          cd ..

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidEpubReader-unsigned-ipa
          path: build/LiquidEpubReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
