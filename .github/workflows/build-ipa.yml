name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "=== macOS & Xcode Environment ==="
          sw_vers
          xcodebuild -version || true
          xcrun --show-sdk-version --sdk iphoneos || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Compile Native Swift/SwiftUI iOS App
        run: |
          echo "=== 编译原生 iOS Swift/SwiftUI 应用二进制 ==="
          mkdir -p build/Payload/LiquidEpubReader.app
          
          # 获取 iPhoneOS SDK 路径
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iPhoneOS SDK 路径: $IPHONEOS_SDK"
          
          # 使用 Swift 编译器构建 arm64 原生 iOS Mach-O 可执行文件
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$IPHONEOS_SDK" \
            -parse-as-library \
            -O \
            -framework UIKit \
            -framework SwiftUI \
            -framework Foundation \
            LiquidEpubReaderApp.swift \
            LiquidEpubReaderView.swift \
            LiquidGlassEngine.swift \
            -o build/Payload/LiquidEpubReader.app/LiquidEpubReader
          
          chmod +x build/Payload/LiquidEpubReader.app/LiquidEpubReader
          echo "✓ 编译完成，Mach-O 文件信息："
          file build/Payload/LiquidEpubReader.app/LiquidEpubReader

      - name: Assemble App Bundle Structure
        run: |
          echo "=== 组装 App Bundle 配置与资源 ==="
          # 1. 拷贝 Info.plist
          cp Info.plist build/Payload/LiquidEpubReader.app/Info.plist
          
          # 2. 生成 PkgInfo
          echo -n "APPL????" > build/Payload/LiquidEpubReader.app/PkgInfo
          
          # 3. 验证 Bundle 基础结构
          ls -la build/Payload/LiquidEpubReader.app/

      - name: Ad-Hoc Code Sign App Bundle
        run: |
          echo "=== 应用 Ad-Hoc 签名（防止 iOS AMFID 内核拦截与闪退） ==="
          codesign -s - --force --deep build/Payload/LiquidEpubReader.app
          codesign -vvv build/Payload/LiquidEpubReader.app

      - name: Package Unsigned .ipa
        run: |
          echo "=== 封装 .ipa 归档 ==="
          cd build
          zip -r -y LiquidEpubReader-unsigned.ipa Payload
          ls -lh LiquidEpubReader-unsigned.ipa
          cd ..

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidEpubReader-unsigned-ipa
          path: build/LiquidEpubReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
